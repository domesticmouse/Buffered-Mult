<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E08F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  <!-- Black Solder Mask Background -->
  <rect width="400" height="400" fill="#121212" rx="16"/>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#222" stroke-width="2" rx="12"/>

  <!-- Concept Title (Silkscreen White) -->
  <text x="200" y="45" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CONCEPT 1: TECHNICAL DIP-14 CREST</text>

  <!-- DIP-14 IC Chip Outline (Gold ENIG) -->
  <g transform="translate(200, 190)">
    <!-- Main IC Chip Body -->
    <rect x="-60" y="-80" width="120" height="160" fill="none" stroke="url(#gold)" stroke-width="4" rx="4"/>
    <!-- Pin 1 Notch -->
    <path d="M -20 -80 A 20 20 0 0 0 20 -80" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <!-- Pin 1 Dot -->
    <circle cx="-40" cy="-60" r="5" fill="url(#gold)"/>

    <!-- IC Pins (7 Left, 7 Right) -->
    <!-- Left Pins -->
    <line x1="-80" y1="-60" x2="-60" y2="-60" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-80" y1="-40" x2="-60" y2="-40" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-80" y1="-20" x2="-60" y2="-20" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-80" y1="0" x2="-60" y2="0" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-80" y1="20" x2="-60" y2="20" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-80" y1="40" x2="-60" y2="40" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-80" y1="60" x2="-60" y2="60" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <!-- Right Pins -->
    <line x1="60" y1="-60" x2="80" y2="-60" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="-40" x2="80" y2="-40" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="-20" x2="80" y2="-20" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="0" x2="80" y2="0" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="20" x2="80" y2="20" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="40" x2="80" y2="40" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="60" x2="80" y2="60" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>

    <!-- 4 Op-Amp Triangles Inside Chip Body (Silkscreen White & Gold) -->
    <!-- Top-Left OpAmp -->
    <polygon points="-45,-50 -45,-15 -15,-32.5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="-40" y="-38" font-family="sans-serif" font-size="10" fill="#FFFFFF">+</text>
    <text x="-40" y="-20" font-family="sans-serif" font-size="10" fill="#FFFFFF">-</text>

    <!-- Top-Right OpAmp -->
    <polygon points="45,-50 45,-15 15,-32.5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="35" y="-38" font-family="sans-serif" font-size="10" fill="#FFFFFF">+</text>
    <text x="35" y="-20" font-family="sans-serif" font-size="10" fill="#FFFFFF">-</text>

    <!-- Bottom-Left OpAmp -->
    <polygon points="-45,15 -45,50 -15,32.5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="-40" y="27" font-family="sans-serif" font-size="10" fill="#FFFFFF">+</text>
    <text x="-40" y="45" font-family="sans-serif" font-size="10" fill="#FFFFFF">-</text>

    <!-- Bottom-Right OpAmp -->
    <polygon points="45,15 45,50 15,32.5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="35" y="27" font-family="sans-serif" font-size="10" fill="#FFFFFF">+</text>
    <text x="35" y="45" font-family="sans-serif" font-size="10" fill="#FFFFFF">-</text>

    <!-- TL074 Text (Silkscreen White) -->
    <text x="0" y="5" font-family="sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TL074</text>
    <text x="0" y="18" font-family="sans-serif" font-size="7" fill="url(#gold)" text-anchor="middle" letter-spacing="1">QUAD OP-AMP</text>
  </g>

  <!-- Title Text below logo (Silkscreen White) -->
  <text x="200" y="325" font-family="sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">BUFF MULT</text>
  <text x="200" y="350" font-family="sans-serif" font-size="10" fill="url(#gold)" text-anchor="middle" letter-spacing="3">BUFFERED MULTIPLE</text>
</svg>
