<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E08F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  <!-- Black Solder Mask Background -->
  <rect width="400" height="400" fill="#121212" rx="16"/>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#222" stroke-width="2" rx="12"/>

  <!-- Concept Title (Silkscreen White) -->
  <text x="200" y="45" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CONCEPT 2: MINIMALIST GEOMETRIC</text>

  <g transform="translate(200, 180)">
    <!-- Single Input Trace (White Silkscreen) -->
    <path d="M -140,0 L -70,0" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="-140" cy="0" r="7" fill="url(#gold)"/>
    <text x="-140" y="-15" font-family="sans-serif" font-weight="bold" font-size="10" fill="#FFFFFF" text-anchor="middle">IN</text>

    <!-- Large Central Op-Amp Triangle (Gold ENIG outline) -->
    <polygon points="-70,-60 -70,60 20,0" fill="#1A1A1A" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Op-Amp Inputs (+ / -) in White -->
    <text x="-60" y="-30" font-family="sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">+</text>
    <text x="-60" y="38" font-family="sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">-</text>
    
    <!-- Subtle TL074 Text inside triangle (Silkscreen White) -->
    <text x="-40" y="4" font-family="sans-serif" font-weight="bold" font-size="12" fill="url(#gold)" letter-spacing="1">TL074</text>

    <!-- 1-to-4 Signal Splitting Branches (Gold ENIG Traces & Nodes) -->
    <path d="M 20,0 L 50,-60 L 110,-60" stroke="url(#gold)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 20,0 L 50,-20 L 110,-20" stroke="url(#gold)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 20,0 L 50,20 L 110,20" stroke="url(#gold)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 20,0 L 50,60 L 110,60" stroke="url(#gold)" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- 4 Output Solder Pad / Nodes (Gold Circles) -->
    <circle cx="110" cy="-60" r="6" fill="url(#gold)" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="110" cy="-20" r="6" fill="url(#gold)" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="110" cy="20" r="6" fill="url(#gold)" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="110" cy="60" r="6" fill="url(#gold)" stroke="#FFFFFF" stroke-width="1.5"/>

    <text x="125" y="-56" font-family="sans-serif" font-size="9" fill="#FFFFFF">1</text>
    <text x="125" y="-16" font-family="sans-serif" font-size="9" fill="#FFFFFF">2</text>
    <text x="125" y="24" font-family="sans-serif" font-size="9" fill="#FFFFFF">3</text>
    <text x="125" y="64" font-family="sans-serif" font-size="9" fill="#FFFFFF">4</text>
  </g>

  <!-- Typography below (Silkscreen White + Gold Accent) -->
  <text x="200" y="325" font-family="sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">BUFF MULT</text>
  <line x1="120" y1="337" x2="280" y2="337" stroke="url(#gold)" stroke-width="2"/>
  <text x="200" y="355" font-family="sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">QUAD UNITY GAIN BUFFER</text>
</svg>
