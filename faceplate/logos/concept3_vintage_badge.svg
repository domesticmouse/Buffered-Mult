<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E08F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  <!-- Black Solder Mask Background -->
  <rect width="400" height="400" fill="#121212" rx="16"/>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#222" stroke-width="2" rx="12"/>

  <!-- Concept Title (Silkscreen White) -->
  <text x="200" y="45" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CONCEPT 3: VINTAGE SYNTH BADGE</text>

  <!-- Outer Emblem Border (Gold ENIG Frame) -->
  <g transform="translate(200, 200)">
    <rect x="-140" y="-120" width="280" height="200" fill="#161616" stroke="url(#gold)" stroke-width="4" rx="10"/>
    <rect x="-134" y="-114" width="268" height="188" fill="none" stroke="#FFFFFF" stroke-width="1.5" rx="6"/>

    <!-- Header Banner (Gold Copper Block) -->
    <rect x="-132" y="-112" width="264" height="40" fill="url(#gold)"/>
    <text x="0" y="-86" font-family="sans-serif" font-weight="900" font-size="18" fill="#121212" text-anchor="middle" letter-spacing="3">TL074 BI-FET</text>

    <!-- Subheader Text (White Silkscreen) -->
    <text x="0" y="-55" font-family="sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">QUAD OPERATIONAL AMPLIFIER</text>

    <!-- Center Divider Line (Gold) -->
    <line x1="-110" y1="-42" x2="110" y2="-42" stroke="url(#gold)" stroke-width="1.5"/>

    <!-- Center Icon: Stylized Waveform + Buffer Triangle -->
    <polygon points="-50,-10 -50,30 0,10" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Wave In -->
    <path d="M -90,10 Q -80,-5 -70,10 T -50,10" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- 4 Waves Out -->
    <path d="M 0,10 L 30,-15 L 80,-15" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M 0,10 L 30,-5 L 80,-5" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M 0,10 L 30,5 L 80,5" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M 0,10 L 30,15 L 80,15" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Spec details at bottom of badge (White Silkscreen) -->
    <text x="-90" y="55" font-family="monospace" font-size="9" fill="#FFFFFF">IN: HIGH IMPEDANCE</text>
    <text x="90" y="55" font-family="monospace" font-size="9" fill="url(#gold)" text-anchor="end">OUT: LOW IMPEDANCE</text>
  </g>

  <!-- Large Bottom Title (White Silkscreen) -->
  <text x="200" y="340" font-family="sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">BUFF MULT</text>
  <text x="200" y="362" font-family="sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SIGNAL MULTIPLIER</text>
</svg>
